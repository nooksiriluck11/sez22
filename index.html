<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>22 kV Distribution System Construction Plan</title>
  <!-- palette v3 -->

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://js.arcgis.com/4.17/esri/themes/light/main.css" />
  <script src="https://js.arcgis.com/4.17/"></script>

  <style>
    :root {
      /* palette: green / mint / lavender / coral / navy */
      --lav:#C8C2E0; --purple:#C8C2E0; --orange:#F05C4F; --dark:#292866; --blush:#97D0B1;
      --purple-deep:#292866; --money:#F05C4F; --side-bg:#f4f3f9; --card-bd:#e5e2ef;
    }
    html, body { margin: 0; height: 100%; color: var(--dark);
      font-family: "IBM Plex Sans Thai", "Segoe UI", Tahoma, sans-serif;
      -webkit-font-smoothing: antialiased; }
    #app { display: flex; flex-direction: column; height: 100%; }

    #header { height: 52px; flex: 0 0 52px; color:var(--purple-deep); display:flex; align-items:center;
      padding:0 16px; background: var(--lav);
      box-shadow:0 2px 6px rgba(0,0,0,.12); z-index:50; gap:8px; }
    #header .logo { width:34px; height:34px; border-radius:6px; background:#fff; color:#4a148c;
      display:flex; align-items:center; justify-content:center; font-weight:800; }
    #header h1 { font-size:15px; margin:0 8px 0 4px; font-weight:600; white-space:nowrap; }
    #header .spacer { flex:1; }
    .hbtn { background:rgba(41,40,102,.08); color:var(--purple-deep); border:1px solid rgba(41,40,102,.28);
      border-radius:6px; padding:6px 11px; font-size:12.5px; cursor:pointer; white-space:nowrap; }
    .hbtn:hover { background:rgba(41,40,102,.16); }
    .hbtn.primary { background:var(--purple-deep); color:#fff; font-weight:600; border-color:var(--purple-deep); }
    .hbtn.primary:hover { background:#1e1d4d; }
    #sideToggle { padding:5px 9px; font-size:14px; line-height:1; }

    #main { flex:1; display:flex; min-height:0; }
    #side { width:500px; flex:0 0 500px; background:var(--side-bg); border-right:1px solid #e2ddf0;
      min-height:0; overflow:hidden; transition:flex-basis .25s ease, width .25s ease; }
    #side.collapsed { flex-basis:0; width:0; border-right:none; }
    #sideInner { width:500px; height:100%; display:flex; flex-direction:column; min-height:0; }

    /* KPI: การ์ดขาว minimal + จุดสีบอกหมวด */
    #kpis { display:grid; grid-template-columns:repeat(12,1fr); gap:9px; padding:14px; }
    .kpi { grid-column: span 4; min-width:0; background:#fff; border-radius:13px; padding:10px 13px;
      box-shadow:0 1px 3px rgba(41,40,102,.07); }   /* 3 การ์ดต่อแถว */
    .kpi .label { display:flex; align-items:center; gap:6px; font-size:10.5px; color:#8b8393; font-weight:500; }
    .kpi .dot { width:7px; height:7px; border-radius:50%; flex:0 0 auto; }
    .kpi .value { font-size:19px; font-weight:700; color:var(--dark); margin-top:4px; line-height:1.1; }
    .kpi .unit { font-size:10.5px; color:#aaa4b6; font-weight:500; }
    .kpi.cost { background:#fdf1ef; }
    .kpi.cost .value { color:var(--money); }
    /* การ์ดใหญ่ "ปริมาณพัสดุ" ครอบ 3 ตัวเลขย่อย */
    .kpi-group { grid-column: span 12; background:#fff; border-radius:13px; padding:11px 15px 13px;
      box-shadow:0 1px 3px rgba(41,40,102,.07); }
    .group-title { display:flex; align-items:center; gap:7px; font-size:11.5px; color:#7d7896; font-weight:600; margin-bottom:11px; }
    .group-title::before { content:""; width:4px; height:14px; border-radius:2px; background:var(--purple-deep); }
    .group-body { display:grid; grid-template-columns:repeat(3,1fr); }
    .sub { min-width:0; padding:0 15px; }
    .sub:first-child { padding-left:0; }
    .sub + .sub { border-left:1px solid #efedf6; }
    .sub .label { display:flex; align-items:center; gap:6px; font-size:10.5px; color:#8b8393; font-weight:500; }
    .sub .dot { width:7px; height:7px; border-radius:50%; flex:0 0 auto; }
    .sub .value { font-size:18px; font-weight:700; color:var(--dark); margin-top:3px; line-height:1.1; }
    .sub .unit { font-size:10.5px; color:#aaa4b6; font-weight:500; }

    #tableWrap { flex:1; overflow:auto; margin:0 14px 14px; background:#fff; border-radius:13px;
      box-shadow:0 1px 3px rgba(41,40,102,.07); }
    table { width:100%; border-collapse:collapse; font-size:11.5px; background:transparent; }
    th, td { border-bottom:1px solid #f2f0f8; padding:7px 9px; text-align:left; white-space:nowrap; }
    th { position:sticky; top:0; background:#fff; color:#8b8393; z-index:1; text-align:right; font-weight:600; border-bottom:1.5px solid #e9e5f2; }
    th:first-child { text-align:left; }
    td.num { text-align:right; font-variant-numeric:tabular-nums; }
    /* คอลัมน์อื่นกว้างพอดีเนื้อหา (nowrap) ; คอลัมน์งานกว้างคงที่ แสดงชื่อเต็มโดยตัดขึ้นบรรทัดใหม่ */
    #jobTable { table-layout:auto; width:100%; }
    #jobTable th, #jobTable td { padding:7px 8px; white-space:nowrap; }
    #jobTable th:first-child, #jobTable td.jobCell { width:210px; min-width:210px; white-space:normal; vertical-align:top; }
    .jobName { line-height:1.3; word-break:break-word; overflow-wrap:anywhere; }  /* แสดงครบ ไม่ตัดท้าย */
    #jobTable .miniBtn { padding:1px 2px; font-size:12px; }
    /* badge สถานะ */
    .badge { display:inline-block; padding:2px 9px; border-radius:11px; font-size:10.5px; font-weight:600; white-space:nowrap; }
    .badge.ok { background:#e4f5ec; color:#1f7a4d; }
    .badge.no { background:#fdece9; color:#c0392b; }
    tr.jobRow { cursor:pointer; }
    tr.jobRow:hover { background:#f6f4fb; }
    tr.jobRow.active { background:#eee9f7; }
    tfoot td { font-weight:700; background:#faf9fd; color:var(--purple-deep); border-top:1.5px solid #e9e5f2; position:sticky; bottom:0; }
    .miniBtn { border:none; background:none; cursor:pointer; font-size:13px; padding:2px 4px; border-radius:4px; }
    .miniBtn:hover { background:#eee9f7; }

    #viewDiv { flex:1; position:relative; }
    #hint { position:absolute; top:10px; left:50%; transform:translateX(-50%); z-index:20;
      background:rgba(74,20,140,.92); color:#fff; padding:7px 14px; border-radius:20px; font-size:12.5px;
      display:none; }

    /* tooltip ตอนเอาเมาส์ชี้เส้น */
    #tip { position:absolute; z-index:30; pointer-events:none; display:none;
      background:#fff; border:1px solid #ddd; border-top:3px solid var(--purple-deep); border-radius:8px;
      box-shadow:0 6px 20px rgba(41,40,102,.22); padding:9px 12px; font-size:12.5px; width:280px; max-width:280px; box-sizing:border-box; }
    #tip .tipTitle { font-weight:700; color:var(--purple-deep); margin-bottom:6px; font-size:13.5px; word-break:break-word; }
    #tip table { width:100%; table-layout:fixed; border-collapse:collapse; }
    #tip td { padding:1px 0; border:none; vertical-align:top; }
    #tip td.k { width:44%; color:#777; padding-right:12px; word-break:break-word; }
    #tip td.v { width:56%; text-align:right; font-variant-numeric:tabular-nums; word-break:break-word; overflow-wrap:anywhere; }

    /* Modal ฟอร์มงาน */
    #modal { position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:100;
      display:none; align-items:center; justify-content:center; }
    #modalCard { background:#fff; border-radius:10px; width:340px; padding:18px 20px;
      box-shadow:0 10px 30px rgba(0,0,0,.3); max-height:90vh; overflow:auto; }
    #modalCard h2 { margin:0 0 14px; font-size:16px; color:var(--purple-deep); }
    #modalCard label { display:block; font-size:12px; color:#555; margin:8px 0 3px; }
    #modalCard input, #modalCard select { width:100%; box-sizing:border-box; padding:7px 8px; border:1px solid #ccc;
      border-radius:5px; font-size:13px; font-family:inherit; background:#fff; }
    #modalCard .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    #modalBtns { display:flex; gap:8px; margin-top:16px; }
    #modalBtns button { flex:1; padding:9px; border-radius:6px; border:none; cursor:pointer; font-size:13px; font-weight:600; }
    #saveBtn { background:var(--purple-deep); color:#fff; }
    #saveBtn:hover { background:#1e1d4d; }
    #cancelBtn { background:#eee; color:#333; }

    /* กล่อง modal ใส่พิกัด (คลาสร่วม) */
    .modal2 { position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:100; display:none; align-items:center; justify-content:center; }
    .mcard { background:#fff; border-radius:10px; width:340px; padding:18px 20px; box-shadow:0 10px 30px rgba(0,0,0,.3); }
    .mcard h2 { margin:0 0 14px; font-size:16px; color:var(--purple-deep); }
    .mcard label { display:block; font-size:12px; color:#555; margin:8px 0 3px; }
    .mcard input { width:100%; box-sizing:border-box; padding:7px 8px; border:1px solid #ccc; border-radius:5px; font-size:13px; font-family:inherit; }
    .mcard .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .mbtns { display:flex; gap:8px; margin-top:16px; }
    .mbtns button { flex:1; padding:9px; border-radius:6px; border:none; cursor:pointer; font-size:13px; font-weight:600; }
    .btnPrimary { background:var(--purple-deep); color:#fff; }
    .btnPrimary:hover { background:#1e1d4d; }
    .btnGhost { background:#eee; color:#333; }
    .midRow { margin-top:8px; padding:8px 10px; background:#f7f6fb; border:1px dashed #d6d0e6; border-radius:8px; }
    .midHead { display:flex; justify-content:space-between; align-items:center; }
    .midHead label { margin:0 !important; color:var(--purple-deep); font-weight:600; }
    .midDel { cursor:pointer; color:#a11; font-weight:bold; padding:0 5px; border-radius:3px; }
    .midDel:hover { background:#f5d6d6; }
    .addMidBtn { margin-top:8px; width:100%; padding:7px; border:1px dashed var(--purple); background:#f4f3f9;
      color:var(--purple-deep); border-radius:8px; cursor:pointer; font-size:12.5px; font-weight:600; }
    .addMidBtn:hover { background:#ece9f5; }

    #empty { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
      flex-direction:column; color:#888; font-size:14px; text-align:center; background:#fafafa; z-index:5; }
    #empty .big { font-size:40px; margin-bottom:10px; }
    #empty button { margin-top:14px; background:var(--purple-deep); color:#fff; border:none; border-radius:8px;
      padding:10px 18px; font-size:14px; cursor:pointer; }
    #empty button:hover { background:#1e1d4d; }
  </style>
</head>
<body>
  <div id="app">
    <div id="header">
      <button class="hbtn" id="sideToggle" title="ย่อ/ขยายแผงข้อมูล">◀</button>
      <h1>22 kV Distribution System Construction Plan</h1>
      <button class="hbtn primary" id="btnDraw">✏️ วาดงานใหม่</button>
      <button class="hbtn" id="snapToggle" title="เปิด/ปิด snap ตามถนน (OSRM)">🛣️ Snap: เปิด</button>
      <button class="hbtn" id="btnCoord" title="เพิ่มงานจากพิกัด เริ่มต้น-สิ้นสุด">📍 ใส่พิกัด</button>
      <div class="spacer"></div>
    </div>

    <div id="main">
      <div id="side">
        <div id="sideInner">
          <div id="kpis"></div>
          <div id="tableWrap"><table id="jobTable"><thead></thead><tbody></tbody><tfoot></tfoot></table></div>
        </div>
      </div>

      <div id="viewDiv">
        <div id="hint"></div>
        <div id="tip"></div>
        <div id="empty">
          <div class="big">🛣️</div>
          <div>กด "✏️ วาดงานใหม่" เพื่อลากแนวเส้นบนแผนที่</div>
          <div style="font-size:12px;color:#aaa;margin-top:6px;">คลิกทีละจุดตามถนน • ดับเบิลคลิกเพื่อจบเส้น</div>
          <button id="emptyDraw">✏️ เริ่มวาดงานแรก</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal ฟอร์มข้อมูลงาน -->
  <div id="modal">
    <div id="modalCard">
      <h2 id="modalTitle">ข้อมูลงาน</h2>
      <div id="distReadout" style="display:none; margin:0 0 12px; padding:8px 10px; background:#f4f3f9; border-radius:8px; font-size:12.5px; color:var(--purple-deep);"></div>
      <label>ชื่อ/รหัสงาน *</label>
      <input id="f_job" type="text" placeholder="เช่น 22kV-บ้านโนนสูง" />
      <div class="grid2">
        <div><label>WBS</label><input id="f_wbs" type="text" placeholder="รหัส WBS" /></div>
        <div><label>เลขแผนผัง</label><input id="f_drawing" type="text" placeholder="เลขแผนผัง" /></div>
      </div>
      <div class="grid2">
        <div><label>ปริมาณ (วงจร-กม.)</label><input id="f_qty" type="number" step="any" /></div>
        <div><label>ค่าใช้จ่ายรวม (บาท)</label><input id="f_cost" type="number" step="any" /></div>
      </div>
      <label>ค่าใช้จ่ายหน้างาน (100%) (บาท)</label>
      <input id="f_costsite" type="number" step="any" />
      <label>สถานะ</label>
      <select id="f_status">
        <option value="ยังไม่อนุมัติ">ยังไม่อนุมัติ</option>
        <option value="อนุมัติ">อนุมัติ</option>
      </select>
      <div class="grid2">
        <div><label>จำนวนเสา 14.30</label><input id="f_p1430" type="number" step="any" /></div>
        <div><label>จำนวนเสา 12.20</label><input id="f_p1220" type="number" step="any" /></div>
      </div>
      <label>ปริมาณ 185 SAC (ม.)</label>
      <input id="f_sac" type="number" step="any" />
      <div id="modalBtns">
        <button id="cancelBtn">ยกเลิก</button>
        <button id="saveBtn">บันทึก</button>
      </div>
    </div>
  </div>

  <!-- Modal ใส่พิกัด เริ่มต้น-สิ้นสุด -->
  <div id="coordModal" class="modal2">
    <div class="mcard">
      <h2>เพิ่มงานจากพิกัด</h2>
      <div style="font-size:12px;color:#777;margin:-6px 0 10px;">ใส่พิกัด (องศาทศนิยม) — เพิ่มจุดกลางได้ถ้าเส้นทางไม่ตรงตามต้องการ</div>
      <label>🟢 จุดเริ่มต้น</label>
      <div class="grid2">
        <input id="c_latS" type="number" step="any" placeholder="lat 17.412500" />
        <input id="c_lngS" type="number" step="any" placeholder="long 102.813400" />
      </div>
      <div id="midPoints"></div>
      <button id="addMid" type="button" class="addMidBtn">+ เพิ่มจุดกลาง</button>
      <label>🔴 จุดสิ้นสุด</label>
      <div class="grid2">
        <input id="c_latE" type="number" step="any" placeholder="lat 17.420100" />
        <input id="c_lngE" type="number" step="any" placeholder="long 102.826500" />
      </div>
      <div class="mbtns">
        <button id="coordCancel" class="btnGhost">ยกเลิก</button>
        <button id="coordCalc" class="btnPrimary">คำนวณแนวถนน</button>
      </div>
    </div>
  </div>

  <script>
    let view, sketch, routeLayer, Graphic, Polyline, SimpleLineSymbol, webMercatorUtils, geometryEngine, Point;
    let records = [];               // {id, job, qty, cost, pole1430, pole1220, sac185, paths(lat/long), lengthM}
    let graphicsById = {};
    let pendingPaths = null, pendingLen = 0, editingId = null, editingOrigJob = null, seq = 1, snapEnabled = true;
    const LS_KEY = "pea_routes22kv_curve_v1";
    const DIRTY_KEY = "pea_dirty22kv_v1";   // ธงบอกว่ามีการแก้ที่ยังไม่ได้เซฟขึ้น Sheet (ข้ามเซสชัน)
    // ===== ฐานข้อมูลกลาง = Google Sheet (ผ่าน Apps Script) =====
    const SHEET_API = "https://script.google.com/macros/s/AKfycbxDbdIchMxbP7v24j1CnA9cSAMrEgWe3u9plCM53DBZZQ0D2Pc0mIlF41trL-4mnjwB/exec";
    const SHEET_TOKEN = "sez22";       // ต้องตรงกับ TOKEN ใน Apps Script
    const AUTO_REFRESH_SEC = 30;       // ดึงข้อมูลใหม่อัตโนมัติทุกกี่วินาที (0 = ปิด)
    const routeSymbol = { type: "simple-line", color: [25, 118, 210, 0.95], width: 4, cap: "round", join: "round" };  // สีตอนวาดเส้นใหม่
    // สีเส้นตามสถานะงาน: อนุมัติ = เขียว, ยังไม่อนุมัติ = แดง
    function colorForStatus(status) { return status === "อนุมัติ" ? [34, 160, 76] : [224, 49, 49]; }
    function lineSymbolFor(status) { return { type: "simple-line", color: colorForStatus(status).concat(0.95), width: 4, cap: "round", join: "round" }; }
    // หมุดต้นทาง/ปลายทาง: จุดกลมสีเดียวกับเส้น (ตามสถานะ) ขอบขาว
    function nodeSymbolFor(status) { return { type: "simple-marker", style: "circle", color: colorForStatus(status).concat(1), size: 10, outline: { color: [255, 255, 255, 1], width: 2 } }; }

    require([
      "esri/Map", "esri/views/MapView", "esri/layers/GraphicsLayer", "esri/layers/MapImageLayer", "esri/widgets/Sketch/SketchViewModel",
      "esri/Graphic", "esri/geometry/Polyline", "esri/symbols/SimpleLineSymbol",
      "esri/geometry/support/webMercatorUtils", "esri/geometry/geometryEngine", "esri/geometry/Point",
      "esri/widgets/ScaleBar", "esri/widgets/Home"
    ], function (Map, MapView, GraphicsLayer, MapImageLayer, SketchViewModel, _G, _PL, _SLS, _wm, _ge, _Pt, ScaleBar, Home) {
      Graphic = _G; Polyline = _PL; SimpleLineSymbol = _SLS; webMercatorUtils = _wm; geometryEngine = _ge; Point = _Pt;

      // ===== Basemap (แผนที่พื้นฐานสะอาดของ Esri) =====
      const map = new Map({ basemap: "streets-vector" });
      view = new MapView({ container: "viewDiv", map: map, center: [102.82, 17.41], zoom: 13 });

      // (เผื่อภายหลัง) ชั้นข้อมูล PEA — ใส่ layer id ที่จะแสดงใน PEA_SHOW_LAYERS แล้วโค้ดจะโหลดให้เอง
      const PEA_URL = "https://gisne1.pea.co.th/arcgis/rest/services/PEA/MapServer";
      const PEA_SHOW_LAYERS = [];   // ว่าง = ใช้แค่ basemap; ใส่ id เพื่อเพิ่มชั้น PEA เช่น [7, 5] (ต้อง VPN)
      if (PEA_SHOW_LAYERS.length) {
        const peaLayer = new MapImageLayer({ url: PEA_URL, title: "ชั้นข้อมูล PEA" });
        map.add(peaLayer);
        window._peaLayer = peaLayer;
        peaLayer.when(function () {
          const all = peaLayer.allSublayers;
          const parentOf = {};
          all.forEach(function (sl) { parentOf[sl.id] = (sl.parent && sl.parent.id != null) ? sl.parent.id : null; });
          function inShow(id) { let c = id, g = 0; while (c != null && g++ < 60) { if (PEA_SHOW_LAYERS.indexOf(c) >= 0) return true; c = parentOf[c]; } return false; }
          const showSet = {};
          all.forEach(function (sl) { if (inShow(sl.id)) showSet[sl.id] = true; });
          PEA_SHOW_LAYERS.forEach(function (id) { let c = id; while (c != null) { showSet[c] = true; c = parentOf[c]; } });
          all.forEach(function (sl) { sl.visible = !!showSet[sl.id]; });
        }, function (err) { console.warn("โหลดชั้น PEA ไม่สำเร็จ (ต้อง VPN):", err && err.message); });
      }

      routeLayer = new GraphicsLayer({ title: "งานก่อสร้าง 22kV" });
      map.add(routeLayer);   // อยู่บนสุด

      // SketchViewModel = วาดเส้นได้โดยไม่มีกล่องเครื่องมือ (toolbar) บนแผนที่
      sketch = new SketchViewModel({
        view: view, layer: routeLayer,
        polylineSymbol: routeSymbol,
        defaultUpdateOptions: { tool: "move", enableRotation: false, enableScaling: false, multipleSelectionEnabled: false, toggleToolOnClick: false }
      });
      view.ui.add(new Home({ view: view }), "top-left");
      view.ui.add(new ScaleBar({ view: view, unit: "metric" }), "bottom-left");
      view.popup.autoOpenEnabled = false;   // คุม popup เอง: คลิกเส้น=รายละเอียด, คลิกจุด=ลากย้าย

      // วาดเส้นใหม่เสร็จ -> เปิดฟอร์ม
      sketch.on("create", function (e) {
        if (e.state === "complete") {
          const clicked = toLatLng(e.graphic.geometry);   // [[[lng,lat],...]] จุดที่คลิก
          routeLayer.remove(e.graphic);
          editingId = null;
          const pts = clicked[0] || [];
          if (snapEnabled && pts.length >= 2) {
            snapToRoad(pts);                 // async: snap ตามถนน แล้วค่อย openForm
          } else {
            pendingPaths = clicked;
            pendingLen = geodesicOf(pts);
            openForm(null);
          }
        }
      });

      // อนุญาตให้ขยับได้เฉพาะ "จุดต้น/ปลาย" เท่านั้น (ห้ามดัดรูปทรงของเส้น)
      let nodeMoveBackup = null;
      sketch.on("update", function (e) {
        const g = e.graphics && e.graphics[0];
        if (!g || !g.attributes || g.attributes.node == null) { sketch.cancel(); return; }  // ไม่ใช่จุดต้น/ปลาย -> ยกเลิก
        const rec = records.find(function (r) { return r.id === g.attributes.id; });
        if (!rec || !rec.paths || !rec.paths.length) return;
        if (e.state === "start") { nodeMoveBackup = JSON.parse(JSON.stringify(rec.paths)); }
        if (e.state === "cancel") {
          if (nodeMoveBackup) { rec.paths = nodeMoveBackup; nodeMoveBackup = null; }
          setTimeout(function () { rebuild(); renderDashboard(); }, 0);   // รอ SVM เคลียร์ก่อนค่อย rebuild
          return;
        }
        // start / active / complete : ย้ายปลายนั้นไปตามหมุด
        const geo = webMercatorUtils.webMercatorToGeographic(g.geometry);
        if (g.attributes.node === "start") { rec.paths[0][0] = [geo.x, geo.y]; }
        else { const lp = rec.paths[rec.paths.length - 1]; lp[lp.length - 1] = [geo.x, geo.y]; }
        const wm = webMercatorUtils.geographicToWebMercator(new Polyline({ paths: rec.paths, spatialReference: { wkid: 4326 } }));
        const lineG = graphicsById[rec.id];
        if (lineG) lineG.geometry = wm;                                   // เส้นขยับตามทันที
        rec.lengthM = geometryEngine.geodesicLength(wm, "meters");
        if (e.state === "complete") {
          nodeMoveBackup = null;
          if (snapEnabled && rec.paths[0] && rec.paths[0].length >= 2) {
            const sPt = rec.paths[0][0];
            const lPath = rec.paths[rec.paths.length - 1];
            const ePt = lPath[lPath.length - 1];
            setTimeout(function () { resnapRecord(rec, [sPt, ePt]); }, 0);   // คำนวณเส้นทางใหม่ตามถนน
          } else {
            saveLS();
            setTimeout(function () { rebuild(); renderDashboard(); }, 0);
          }
        }
      });

      // คลิกจุดต้น/ปลาย = เริ่มลากย้าย ; คลิกเส้น = เปิดรายละเอียด
      view.on("click", function (event) {
        if (sketch && sketch.state === "active") return;   // กำลังวาด/ย้ายอยู่ ข้ามไป
        view.hitTest(event).then(function (resp) {
          const hits = resp.results.filter(function (r) { return r.graphic && r.graphic.layer === routeLayer; });
          const node = hits.find(function (r) { return r.graphic.attributes && r.graphic.attributes.node != null; });
          if (node) { sketch.update([node.graphic], { tool: "move" }); return; }
          const line = hits.find(function (r) { return r.graphic.symbol && r.graphic.symbol.type === "simple-line" && r.graphic.attributes && r.graphic.attributes.id != null; });
          if (line) { view.popup.open({ features: [line.graphic], location: event.mapPoint }); }
        }).catch(function () {});
      });

      // เอาเมาส์ชี้เส้น -> โชว์ tooltip ทันที (ไม่ต้องคลิก)
      view.on("pointer-move", function (event) {
        if (sketch && sketch.state === "active") { hideTip(); return; }   // กำลังวาด/ย้ายอยู่ ไม่ต้องโชว์
        view.hitTest(event).then(function (resp) {
          const hit = resp.results.find(function (r) {
            return r.graphic && r.graphic.layer === routeLayer && r.graphic.attributes && r.graphic.attributes.id != null;
          });
          if (hit) {
            const rec = records.find(function (x) { return x.id === hit.graphic.attributes.id; });
            if (rec) { showTip(rec, event.x, event.y); view.container.style.cursor = "pointer"; return; }
          }
          hideTip(); view.container.style.cursor = "";
        }).catch(function () {});
      });
      view.on("pointer-leave", hideTip);

      window._view = view; window._records = records;
      loadLS();                          // แสดงข้อมูลในเครื่องก่อน (เร็ว)
      if (SHEET_API) {
        let hadUnsaved = false;
        try { hadUnsaved = localStorage.getItem(DIRTY_KEY) === "1"; } catch (e) {}
        if (hadUnsaved && records.length) {
          // เซสชันก่อนแก้ไว้แต่ยังเซฟขึ้น Sheet ไม่สำเร็จ -> ดันขึ้น Sheet ก่อน อย่าดึงมาทับ (กันงานหาย)
          flash("⤴ มีข้อมูลค้างจากครั้งก่อน กำลังบันทึกขึ้น Sheet...");
          scheduleSheetSave();           // ตั้ง pendingSave -> sheetGet จะถูกบล็อกจนเซฟเสร็จ
        } else {
          sheetGet();                    // ดึงล่าสุดจาก Google Sheet มาทับ
        }
        if (AUTO_REFRESH_SEC > 0) setInterval(function () {
          if (saving || pendingSave) return;   // กำลังเซฟ/มีงานค้างยังไม่เซฟ -> ห้ามดึงมาทับ (กันงานหาย)
          if (sketch && sketch.state === "active") return;  // กำลังวาด/ลากจุดอยู่
          if ($("modal").style.display === "flex" || $("coordModal").style.display === "flex") return; // กำลังกรอกฟอร์ม
          sheetGet();
        }, AUTO_REFRESH_SEC * 1000);
      }
    });

    // ---------- tooltip (hover) ----------
    function tipRow(k, v, u) { return "<tr><td class='k'>" + k + "</td><td class='v'>" + fmt(v) + (u ? " <span style='color:#a99fb3'>" + u + "</span>" : "") + "</td></tr>"; }
    function tooltipHTML(rec) {
      return "<div class='tipTitle'>" + rec.job + "</div><table>" +
        tipRow("WBS", rec.wbs) +
        tipRow("เลขแผนผัง", rec.drawing) +
        tipRow("ระยะทาง", Math.round(rec.lengthM || 0), "ม.") +
        tipRow("ปริมาณ", rec.qty, "วงจร-กม.") +
        tipRow("ค่าใช้จ่ายรวม", rec.cost, "บาท") +
        tipRow("ค่าใช้จ่ายหน้างาน (100%)", rec.costSite, "บาท") +
        tipRow("สถานะ", rec.status || "ยังไม่อนุมัติ") +
        tipRow("จำนวนเสา 14.30", rec.pole1430, "ต้น") +
        tipRow("จำนวนเสา 12.20", rec.pole1220, "ต้น") +
        tipRow("ปริมาณ 185 SAC", rec.sac185, "เมตร") + "</table>";
    }
    function showTip(rec, x, y) {
      const tip = document.getElementById("tip"), vd = document.getElementById("viewDiv");
      tip.innerHTML = tooltipHTML(rec);
      tip.style.display = "block";
      let left = x + 16, top = y + 16;
      if (left + tip.offsetWidth > vd.clientWidth) left = x - tip.offsetWidth - 16;
      if (top + tip.offsetHeight > vd.clientHeight) top = y - tip.offsetHeight - 16;
      tip.style.left = Math.max(4, left) + "px";
      tip.style.top = Math.max(4, top) + "px";
    }
    function hideTip() { const t = document.getElementById("tip"); if (t) t.style.display = "none"; }

    // ---------- geometry helpers ----------
    function toLatLng(geom) { return webMercatorUtils.webMercatorToGeographic(geom).paths; }
    function recordToGraphic(rec) {
      const wm = webMercatorUtils.geographicToWebMercator(
        new Polyline({ paths: rec.paths, spatialReference: { wkid: 4326 } }));
      return new Graphic({
        geometry: wm, symbol: lineSymbolFor(rec.status),
        attributes: { id: rec.id, job: rec.job }, popupTemplate: makePopup(rec)
      });
    }
    function makePopup(rec) {
      // คืนค่าเป็น DOM element (ไม่ใช่ string) เพื่อไม่ให้ ArcGIS ลบ inline style ทิ้ง
      return { title: rec.job, overwriteActions: true, actions: [], content: function () {
        const div = document.createElement("div");
        div.style.cssText = "width:280px;max-width:100%";
        div.innerHTML = "<table style='font-size:13px;width:100%;table-layout:fixed;border-collapse:collapse'>" +
          rowHtml("WBS", rec.wbs) +
          rowHtml("เลขแผนผัง", rec.drawing) +
          rowHtml("ระยะทาง", Math.round(rec.lengthM || 0), "ม.") +
          rowHtml("ปริมาณ", rec.qty, "วงจร-กม.") +
          rowHtml("ค่าใช้จ่ายรวม", rec.cost, "บาท") +
          rowHtml("ค่าใช้จ่ายหน้างาน (100%)", rec.costSite, "บาท") +
          rowHtml("สถานะ", rec.status || "ยังไม่อนุมัติ") +
          rowHtml("จำนวนเสา 14.30", rec.pole1430, "ต้น") +
          rowHtml("จำนวนเสา 12.20", rec.pole1220, "ต้น") +
          rowHtml("ปริมาณ 185 SAC", rec.sac185, "เมตร") + "</table>";
        return div;
      } };
    }
    function totalPts(rec) { let n = 0; (rec.paths || []).forEach(function (p) { n += p.length; }); return n; }
    function rowHtml(l, v, u) {
      return "<tr>" +
        "<td style='box-sizing:border-box;width:45%;color:#777;padding:2px 10px 2px 0;vertical-align:top;word-break:break-word'>" + l + "</td>" +
        "<td style='box-sizing:border-box;width:55%;text-align:right;vertical-align:top;word-break:break-word;overflow-wrap:anywhere'>" + fmt(v) + (u ? " <span style='color:#999'>" + u + "</span>" : "") + "</td></tr>";
    }
    function fmt(v) { return (v == null || v === "") ? "-" : (typeof v === "number" ? v.toLocaleString("th-TH") : v); }

    // จุดต้นทาง-ปลายทางของเส้น (geographic lng/lat)
    function endpointsOf(rec) {
      const paths = rec.paths || [];
      if (!paths.length || !paths[0] || !paths[0].length) return null;
      const first = paths[0][0];
      const lastPath = paths[paths.length - 1];
      const last = lastPath[lastPath.length - 1];
      return { start: first, end: last };
    }
    function wmPoint(lng, lat) {
      return webMercatorUtils.geographicToWebMercator(new Point({ x: lng, y: lat, spatialReference: { wkid: 4326 } }));
    }
    // เพิ่มหมุดต้นทาง/ปลายทาง + ป้ายชื่องาน ลงบน routeLayer
    function addEndpointGraphics(rec) {
      const ep = endpointsOf(rec); if (!ep) return;
      const sp = wmPoint(ep.start[0], ep.start[1]);
      const pe = wmPoint(ep.end[0], ep.end[1]);
      routeLayer.add(new Graphic({ geometry: sp, symbol: nodeSymbolFor(rec.status), attributes: { id: rec.id, job: rec.job, node: "start" } }));
      routeLayer.add(new Graphic({ geometry: pe, symbol: nodeSymbolFor(rec.status), attributes: { id: rec.id, job: rec.job, node: "end" } }));
    }

    // ---------- rebuild graphics ----------
    function rebuild() {
      routeLayer.removeAll(); graphicsById = {};
      records.forEach(function (rec) {
        const g = recordToGraphic(rec); routeLayer.add(g); graphicsById[rec.id] = g;
        addEndpointGraphics(rec);
      });
      document.getElementById("empty").style.display = records.length ? "none" : "";
    }

    // ---------- ฟอร์มงาน ----------
    const $ = function (id) { return document.getElementById(id); };
    function openForm(rec) {
      $("modalTitle").textContent = rec ? "แก้ไขข้อมูลงาน" : "ข้อมูลงานใหม่";
      const lenM = rec ? (rec.lengthM || 0) : (pendingLen || 0);
      const km = Math.round(lenM / 10) / 100;   // ระยะทางเป็น กม. (2 ทศนิยม)
      $("f_job").value = rec ? rec.job : "";
      $("f_wbs").value = rec && rec.wbs != null ? rec.wbs : "";
      $("f_drawing").value = rec && rec.drawing != null ? rec.drawing : "";
      // เติม "ปริมาณ (วงจร-กม.)" อัตโนมัติจากระยะทางที่คำนวณ (งานใหม่); แก้ไขทีหลังได้
      $("f_qty").value = rec && rec.qty != null ? rec.qty : (km || "");
      $("f_cost").value = rec && rec.cost != null ? rec.cost : "";
      $("f_costsite").value = rec && rec.costSite != null ? rec.costSite : "";
      $("f_status").value = rec && rec.status ? rec.status : "ยังไม่อนุมัติ";
      $("f_p1430").value = rec && rec.pole1430 != null ? rec.pole1430 : "";
      $("f_p1220").value = rec && rec.pole1220 != null ? rec.pole1220 : "";
      $("f_sac").value = rec && rec.sac185 != null ? rec.sac185 : "";
      const ro = $("distReadout");
      if (lenM > 0) {
        ro.style.display = "block";
        ro.innerHTML = "📏 ระยะทางจากแนวเส้น: <b>" + Math.round(lenM).toLocaleString("th-TH") + " ม.</b>" +
          " — เติมช่องปริมาณ (" + km.toLocaleString("th-TH") + " วงจร-กม.) ให้แล้ว";
      } else { ro.style.display = "none"; }
      editingId = rec ? rec.id : editingId;   // เก็บ id ถ้าแก้ไข
      editingOrigJob = rec ? rec.job : null;  // เก็บชื่องานเดิมไว้ fallback (เผื่อ id ถูกรีเฟรชเปลี่ยน)
      $("modal").style.display = "flex";
      $("f_job").focus();
    }
    function closeForm() {
      $("modal").style.display = "none"; pendingPaths = null; editingId = null; editingOrigJob = null;
      $("empty").style.display = records.length ? "none" : "";   // ยกเลิกแล้วยังไม่มีงาน -> โชว์ overlay กลับ
    }
    function numOrNull(v) { return v === "" || v == null ? null : Number(v); }

    function saveForm() {
      const job = $("f_job").value.trim();
      if (!job) { alert("กรุณากรอกชื่องาน"); return; }
      const data = {
        job: job, wbs: $("f_wbs").value.trim(), drawing: $("f_drawing").value.trim(),
        qty: numOrNull($("f_qty").value), cost: numOrNull($("f_cost").value),
        costSite: numOrNull($("f_costsite").value), status: $("f_status").value || "ยังไม่อนุมัติ",
        pole1430: numOrNull($("f_p1430").value), pole1220: numOrNull($("f_p1220").value),
        sac185: numOrNull($("f_sac").value)
      };
      // หางานเป้าหมายที่จะแก้: จาก id ก่อน ถ้าไม่เจอ (id ถูกรีเฟรชเปลี่ยน) fallback จากชื่องานเดิม (ต้องตรงตัวเดียว)
      let target = editingId != null ? records.find(function (r) { return r.id === editingId; }) : null;
      if (!target && editingOrigJob) {
        const matches = records.filter(function (r) { return r.job === editingOrigJob; });
        if (matches.length === 1) target = matches[0];
      }
      if (target) {
        Object.assign(target, data);   // แก้งานเดิม
      } else {
        records.push(Object.assign({ id: seq++, paths: pendingPaths, lengthM: pendingLen }, data));   // เพิ่มงานใหม่
      }
      closeForm(); saveLS(); rebuild(); renderDashboard();
    }

    // ---------- KPI + ตาราง + filter ----------
    function sum(arr, f) { return arr.reduce(function (s, d) { return s + (f(d) || 0); }, 0); }

    // แสดงทุกงานเสมอ (ไม่มี dropdown กรอง)
    function renderDashboard() {
      routeLayer.graphics.forEach(function (g) { g.visible = true; });
      renderKPIs(records);
      renderTable(records);
    }

    // คลิกแถว -> ซูมไปหางาน + ไฮไลต์แถว
    function zoomToJob(id) {
      const g = graphicsById[id]; if (!g) return;
      Array.prototype.forEach.call(document.querySelectorAll("#jobTable tbody tr"), function (tr) {
        tr.classList.toggle("active", Number(tr.getAttribute("data-id")) === id);
      });
      view.goTo(g.geometry).then(function () { view.popup.open({ features: [g], location: g.geometry.extent.center }); }).catch(function () {});
    }
    function renderKPIs(arr) {
      const P = "#406352", M = "#97D0B1", O = "#F05C4F", L = "#C8C2E0", D = "#292866";
      const top = [
        { label: "จำนวนงาน", value: arr.length, unit: "งาน", accent: P, span: 3 },
        { label: "รวมค่าใช้จ่าย", value: sum(arr, function (d) { return d.cost; }), unit: "บาท", cls: "cost", accent: O, span: 5 },
        { label: "รวมปริมาณ", value: sum(arr, function (d) { return d.qty; }), unit: "วงจร-กม.", accent: L, span: 4 }
      ];
      const mat = [
        { label: "รวม 185 SAC", value: sum(arr, function (d) { return d.sac185; }), unit: "เมตร", accent: M },
        { label: "เสา 14.30", value: sum(arr, function (d) { return d.pole1430; }), unit: "ต้น", accent: D },
        { label: "เสา 12.20", value: sum(arr, function (d) { return d.pole1220; }), unit: "ต้น", accent: D }
      ];
      function stat(c, cls) {
        const style = c.span ? ' style="grid-column: span ' + c.span + '"' : '';
        return '<div class="' + cls + ' ' + (c.cls || "") + '"' + style + '>' +
          '<div class="label"><span class="dot" style="background:' + c.accent + '"></span>' + c.label + '</div>' +
          '<div class="value">' + (c.value || 0).toLocaleString("th-TH") + ' <span class="unit">' + c.unit + '</span></div></div>';
      }
      $("kpis").innerHTML =
        top.map(function (c) { return stat(c, "kpi"); }).join("") +
        '<div class="kpi-group"><div class="group-title">ปริมาณพัสดุ</div><div class="group-body">' +
        mat.map(function (c) { return stat(c, "sub"); }).join("") + '</div></div>';
    }
    function km(m) { return Math.round((m || 0) / 100) / 10; }
    function statusBadge(s) { const ok = s === "อนุมัติ"; return '<span class="badge ' + (ok ? "ok" : "no") + '">' + (s || "ยังไม่อนุมัติ") + '</span>'; }
    function renderTable(arr) {
      document.querySelector("#jobTable thead").innerHTML =
        "<tr><th>งาน</th><th style='text-align:left'>WBS</th><th>ปริมาณ</th><th>ค่าใช้จ่ายรวม<br>(บาท)</th><th>ค่าใช้จ่าย<br>หน้างาน<br>(100%)</th><th>สถานะ</th><th>เสา<br>14.30</th><th>เสา<br>12.20</th><th>185<br>SAC</th><th></th></tr>";
      const tb = document.querySelector("#jobTable tbody");
      tb.innerHTML = arr.map(function (d) {
        return '<tr class="jobRow" data-id="' + d.id + '">' +
          '<td class="jobCell"><div class="jobName" title="' + String(d.job || "").replace(/"/g, "&quot;") + '">' + d.job + '</div></td>' +
          '<td title="' + String(d.wbs || "").replace(/"/g, "&quot;") + '">' + (d.wbs || "") + '</td>' +
          '<td class="num">' + fmt(d.qty) + '</td>' +
          '<td class="num" title="' + fmt(d.cost) + ' บาท">' + fmt(d.cost == null ? null : Math.round(d.cost)) + '</td>' +
          '<td class="num" title="' + fmt(d.costSite) + ' บาท">' + fmt(d.costSite == null ? null : Math.round(d.costSite)) + '</td>' +
          '<td>' + statusBadge(d.status) + '</td>' +
          '<td class="num">' + fmt(d.pole1430) + '</td>' +
          '<td class="num">' + fmt(d.pole1220) + '</td>' +
          '<td class="num">' + fmt(d.sac185) + '</td>' +
          '<td style="white-space:nowrap"><button class="miniBtn bEdit" title="แก้ข้อมูล">✏️</button>' +
          '<button class="miniBtn bDel" title="ลบ">🗑️</button></td></tr>';
      }).join("");

      // แถวรวมท้ายตาราง
      document.querySelector("#jobTable tfoot").innerHTML = arr.length ? (
        '<tr><td>รวม (' + arr.length + ' งาน)</td><td></td>' +
        '<td class="num">' + fmt(sum(arr, function (d) { return d.qty; })) + '</td>' +
        '<td class="num" title="' + fmt(sum(arr, function (d) { return d.cost; })) + ' บาท">' + fmt(Math.round(sum(arr, function (d) { return d.cost; }))) + '</td>' +
        '<td class="num" title="' + fmt(sum(arr, function (d) { return d.costSite; })) + ' บาท">' + fmt(Math.round(sum(arr, function (d) { return d.costSite; }))) + '</td>' +
        '<td></td>' +
        '<td class="num">' + fmt(sum(arr, function (d) { return d.pole1430; })) + '</td>' +
        '<td class="num">' + fmt(sum(arr, function (d) { return d.pole1220; })) + '</td>' +
        '<td class="num">' + fmt(sum(arr, function (d) { return d.sac185; })) + '</td><td></td></tr>'
      ) : "";

      Array.prototype.forEach.call(tb.querySelectorAll(".jobRow"), function (tr) {
        const id = Number(tr.getAttribute("data-id"));
        tr.querySelector(".bEdit").onclick = function (e) { e.stopPropagation(); openForm(records.find(function (r) { return r.id === id; })); };
        tr.querySelector(".bDel").onclick = function (e) {
          e.stopPropagation();
          if (!confirm("ลบงาน '" + records.find(function (r) { return r.id === id; }).job + "' ?")) return;
          records = records.filter(function (r) { return r.id !== id; });
          window._records = records; saveLS(); rebuild(); renderDashboard();
        };
        tr.onclick = function () { zoomToJob(id); };
      });
    }

    // ---------- localStorage ----------
    function saveLS() {
      try { localStorage.setItem(LS_KEY, JSON.stringify({ seq: seq, records: records })); } catch (e) {}
      scheduleSheetSave();   // เซฟขึ้น Google Sheet อัตโนมัติทุกครั้งที่ข้อมูลเปลี่ยน
    }
    function loadLS() {
      let d; try { d = JSON.parse(localStorage.getItem(LS_KEY) || "null"); } catch (e) { d = null; }
      if (d && d.records) { records = d.records; seq = d.seq || (records.length + 1); window._records = records; rebuild(); renderDashboard(); }
    }

    function geodesicOf(path) {
      try { const wm = webMercatorUtils.geographicToWebMercator(new Polyline({ paths: [path], spatialReference: { wkid: 4326 } })); return geometryEngine.geodesicLength(wm, "meters"); } catch (e) { return 0; }
    }

    // ---------- OSRM snap-to-road (public demo, ฟรี ไม่ต้อง key) ----------
    function showBusy(on, msg) {
      const h = document.getElementById("hint");
      if (!h) return;
      h.textContent = msg || "⏳ กำลังดึงแนวถนน (OSRM)...";
      h.style.display = on ? "block" : "none";
    }
    function snapToRoad(pts) {
      showBusy(true);
      const coordStr = pts.map(function (c) { return c[0].toFixed(6) + "," + c[1].toFixed(6); }).join(";");
      const url = "https://router.project-osrm.org/route/v1/driving/" + coordStr + "?overview=full&geometries=geojson";
      fetch(url).then(function (r) { return r.json(); }).then(function (data) {
        showBusy(false);
        if (data && data.code === "Ok" && data.routes && data.routes[0] && data.routes[0].geometry) {
          pendingPaths = [data.routes[0].geometry.coordinates];   // แนวถนนจริง [[lng,lat],...]
          pendingLen = data.routes[0].distance;                   // ระยะตามถนน (เมตร)
        } else {
          pendingPaths = [pts]; pendingLen = geodesicOf(pts);
          alert("snap ตามถนนไม่สำเร็จ (" + ((data && data.code) || "error") + ") — ใช้เส้นตรงแทน");
        }
        openForm(null);
      }).catch(function (err) {
        showBusy(false);
        pendingPaths = [pts]; pendingLen = geodesicOf(pts);
        alert("เรียก OSRM ไม่ได้ (server อาจล่ม/ถูกบล็อก) — ใช้เส้นตรงแทน\n" + err.message);
        openForm(null);
      });
    }
    // คำนวณเส้นทางตามถนนใหม่ให้งานเดิม (ใช้ตอนลากจุดต้น/ปลาย) แล้วบันทึก
    function resnapRecord(rec, pts) {
      showBusy(true, "⏳ คำนวณเส้นทางใหม่ตามถนน...");
      saving = true;   // กันไม่ให้ auto-refresh ทับระหว่างรอผล
      const coordStr = pts.map(function (c) { return c[0].toFixed(6) + "," + c[1].toFixed(6); }).join(";");
      const url = "https://router.project-osrm.org/route/v1/driving/" + coordStr + "?overview=full&geometries=geojson";
      function finish() { saving = false; saveLS(); rebuild(); renderDashboard(); }
      fetch(url).then(function (r) { return r.json(); }).then(function (data) {
        showBusy(false);
        if (data && data.code === "Ok" && data.routes && data.routes[0] && data.routes[0].geometry) {
          rec.paths = [data.routes[0].geometry.coordinates];
          rec.lengthM = data.routes[0].distance;
        } else {
          rec.paths = [pts]; rec.lengthM = geodesicOf(pts);
          flash("snap ตามถนนไม่สำเร็จ — ใช้เส้นตรงแทน", true);
        }
        finish();
      }).catch(function (err) {
        showBusy(false);
        rec.paths = [pts]; rec.lengthM = geodesicOf(pts);
        flash("เรียก OSRM ไม่ได้ — ใช้เส้นตรงแทน", true);
        finish();
      });
    }
    // ===== แจ้งเตือนบนแผนที่ =====
    function flash(msg, warn) {
      const h = document.getElementById("hint");
      if (!h) return;
      h.textContent = msg; h.style.display = "block";
      h.style.background = warn ? "rgba(160,40,40,.92)" : "rgba(41,40,102,.92)";
      setTimeout(function () { h.style.display = "none"; h.style.background = ""; }, warn ? 8000 : 4000);
    }
    // ---------- Google Sheet backend (อ่าน+เขียนอัตโนมัติ) ----------
    // pendingSave = มีการแก้ที่ยังเซฟขึ้น Sheet ไม่สำเร็จ -> ห้าม auto-refresh ดึงมาทับ (กันงานหาย)
    let applyingRemote = false, saving = false, saveTimer = null, pendingSave = false, changeSeq = 0, sentSeq = 0;
    function sheetUrl() { return SHEET_API + "?token=" + encodeURIComponent(SHEET_TOKEN); }

    function sheetGet() {
      if (!SHEET_API) return;
      if (pendingSave || saving) return;   // มีงานค้างยังไม่เซฟ -> อย่าดึงมาทับ (กันงานหาย)
      fetch(sheetUrl(), { cache: "no-store" })
        .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
        .then(function (data) {
          if (!Array.isArray(data)) throw new Error(data && data.error ? data.error : "รูปแบบข้อมูลผิด");
          // ถ้าผู้ใช้กำลังกรอกฟอร์ม/วาด/ลากจุดอยู่ อย่าทับ (กัน id เปลี่ยนใต้มือ -> แก้งานกลายเป็นเพิ่มงานซ้ำ)
          if ($("modal").style.display === "flex" || $("coordModal").style.display === "flex" || (sketch && sketch.state === "active")) return;
          applyingRemote = true;
          records = data.filter(function (d) { return d.paths && d.paths[0] && d.paths[0].length; }).map(function (d) {
            return {
              id: seq++, job: d.job, wbs: d.wbs || "", drawing: d.drawing || "",
              qty: d.qty, cost: d.cost, costSite: d.costSite, status: d.status || "ยังไม่อนุมัติ",
              pole1430: d.pole1430, pole1220: d.pole1220, sac185: d.sac185,
              lengthM: d.lengthM || geodesicOf(d.paths[0]), paths: d.paths
            };
          });
          window._records = records; saveLS(); rebuild(); renderDashboard();
          applyingRemote = false;
          flash("✓ ดึงข้อมูลจาก Google Sheet แล้ว (" + records.length + " งาน)");
        })
        .catch(function (err) { flash("⚠ ดึงจาก Sheet ไม่ได้: " + err.message + " — ใช้ข้อมูลในเครื่อง", true); });
    }

    function scheduleSheetSave() {
      if (!SHEET_API || applyingRemote) return;
      pendingSave = true; changeSeq++;           // มีการแก้ใหม่ -> ค้างไว้จนกว่าจะเซฟสำเร็จ
      try { localStorage.setItem(DIRTY_KEY, "1"); } catch (e) {}   // กันข้อมูลหายข้ามเซสชัน (ปิดแท็บก่อนเซฟเสร็จ)
      clearTimeout(saveTimer);
      saveTimer = setTimeout(sheetSave, 900);   // รวมการแก้รัวๆ แล้วค่อยเซฟ
    }
    function sheetSave() {
      if (!SHEET_API) return;
      if (saving) { clearTimeout(saveTimer); saveTimer = setTimeout(sheetSave, 500); return; }   // มี POST ค้างอยู่ รอให้เสร็จก่อน
      saving = true; sentSeq = changeSeq;
      fetch(sheetUrl(), { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(records) })
        .then(function (r) {
          if (!r.ok) throw new Error("HTTP " + r.status);
          saving = false;
          if (changeSeq === sentSeq) { pendingSave = false; try { localStorage.removeItem(DIRTY_KEY); } catch (e) {} }   // เซฟครบแล้ว -> เคลียร์ธงค้าง
          flash("✓ บันทึกขึ้น Google Sheet แล้ว");
        })
        .catch(function (err) {
          saving = false;   // คง pendingSave=true ไว้ -> auto-refresh จะไม่ดึงมาทับ (ข้อมูลยังอยู่ในเครื่อง)
          flash("⚠ บันทึกขึ้น Sheet ไม่ได้: " + err.message + " — จะลองใหม่ใน 5 วิ", true);
          setTimeout(function () { if (pendingSave && !saving) scheduleSheetSave(); }, 5000);   // retry กันงานหาย
        });
    }

    // ---------- wire up ----------
    window.addEventListener("load", function () {
      function startDraw() {
        if (!sketch) { alert("แผนที่ยังโหลดไม่เสร็จ รอสักครู่แล้วลองใหม่"); return; }
        $("empty").style.display = "none";     // ซ่อน overlay ไม่ให้บังการคลิกบนแผนที่
        sketch.create("polyline");
      }
      $("btnDraw").onclick = startDraw;
      $("emptyDraw").onclick = startDraw;
      $("snapToggle").onclick = function () {
        snapEnabled = !snapEnabled;
        this.textContent = "🛣️ Snap: " + (snapEnabled ? "เปิด" : "ปิด");
        this.style.opacity = snapEnabled ? "1" : "0.55";
      };
      // ---- เพิ่มงานจากพิกัด เริ่มต้น-สิ้นสุด ----
      $("btnCoord").onclick = function () {
        $("c_latS").value = $("c_lngS").value = $("c_latE").value = $("c_lngE").value = "";
        $("midPoints").innerHTML = "";
        $("coordModal").style.display = "flex"; $("c_latS").focus();
      };
      function addMidRow() {
        const div = document.createElement("div");
        div.className = "midRow";
        div.innerHTML =
          '<div class="midHead"><label>🔵 จุดกลาง</label><span class="midDel" title="ลบจุดกลาง">✕</span></div>' +
          '<div class="grid2"><input class="mid-lat" type="number" step="any" placeholder="lat" />' +
          '<input class="mid-lng" type="number" step="any" placeholder="long" /></div>';
        div.querySelector(".midDel").onclick = function () { div.remove(); };
        $("midPoints").appendChild(div);
        div.querySelector(".mid-lat").focus();
      }
      $("addMid").onclick = addMidRow;
      $("coordCancel").onclick = function () { $("coordModal").style.display = "none"; };
      $("coordCalc").onclick = function () {
        const latS = parseFloat($("c_latS").value), lngS = parseFloat($("c_lngS").value),
              latE = parseFloat($("c_latE").value), lngE = parseFloat($("c_lngE").value);
        if ([latS, lngS, latE, lngE].some(function (v) { return isNaN(v); })) { alert("กรอกพิกัดจุดเริ่มต้นและสิ้นสุดให้ครบ"); return; }
        const pts = [[lngS, latS]];
        let midHalf = false;
        Array.prototype.forEach.call(document.querySelectorAll("#midPoints .midRow"), function (row) {
          const la = parseFloat(row.querySelector(".mid-lat").value), lo = parseFloat(row.querySelector(".mid-lng").value);
          if (!isNaN(la) && !isNaN(lo)) pts.push([lo, la]);
          else if (!isNaN(la) || !isNaN(lo)) midHalf = true;   // จุดกลางกรอกครึ่งเดียว
        });
        pts.push([lngE, latE]);
        if (midHalf && !confirm("มีจุดกลางที่กรอก lat/long ไม่ครบ จะข้ามจุดนั้น — ไปต่อไหม?")) return;
        const outRange = pts.some(function (p) { return p[1] < 5 || p[1] > 21 || p[0] < 97 || p[0] > 106; });
        if (outRange && !confirm("มีพิกัดนอกช่วงประเทศไทย (lat 5–21, long 97–106) — ใช้ต่อไหม?")) return;
        $("coordModal").style.display = "none";
        $("empty").style.display = "none";
        editingId = null;
        const lons = pts.map(function (p) { return p[0]; }), lats = pts.map(function (p) { return p[1]; });
        view.goTo({ center: [(Math.min.apply(null, lons) + Math.max.apply(null, lons)) / 2,
          (Math.min.apply(null, lats) + Math.max.apply(null, lats)) / 2], zoom: 13 }).catch(function () {});
        if (snapEnabled) { snapToRoad(pts); }
        else { pendingPaths = [pts]; pendingLen = geodesicOf(pts); openForm(null); }
      };
      $("sideToggle").onclick = function () {
        const s = document.getElementById("side");
        s.classList.toggle("collapsed");
        this.textContent = s.classList.contains("collapsed") ? "▶" : "◀";
      };
      $("saveBtn").onclick = saveForm;
      $("cancelBtn").onclick = closeForm;
    });
  </script>
</body>
</html>
